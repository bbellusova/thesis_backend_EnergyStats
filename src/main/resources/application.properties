server.servlet.context-path=/energyStatsApi
server.servlet.session.cookie.path=/

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

spring.jackson.deserialization.fail-on-unknown-properties=false
spring.jackson.serialization.indent-output=true

# 1. Total life of a connection (ms)
spring.datasource.hikari.max-lifetime=540000
# 2. How long a connection can sit unused before being retired (ms)
spring.datasource.hikari.idle-timeout=240000
# 3. Keep-alive ping
spring.datasource.hikari.keepalive-time=30000

server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

springdoc.swagger-ui.with-credentials=true
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.csrf.enabled=true
springdoc.swagger-ui.csrf.cookie-name=XSRF-TOKEN
springdoc.swagger-ui.csrf.header-name=X-XSRF-TOKEN

#to enable only accepting session cookies via HTTPS
server.servlet.session.cookie.secure=${SERVER_SERVLET_SESSION_COOKIE_SECURE:true}

jasypt.encryptor.password=${JASYPT_ENCRYPTOR_PASSWORD}